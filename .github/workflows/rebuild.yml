name: Rebuild

on:
  push:
    branches: [main]
    paths: ["entries/**"]

permissions:
  contents: write

concurrency:
  group: changelog

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run rebuild

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed README.md
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild the feed and README from entries"
          git push
