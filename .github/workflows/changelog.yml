name: Changelog

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Day to summarize, YYYY-MM-DD in UTC. Defaults to yesterday.
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: changelog

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_APP_KEY }}
          owner: 5stackgg
          permission-pull-requests: read

      - name: Get an identity token for the Claude API
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/anthropic-jwt"

      - id: changelog
        run: node scripts/changelog.mjs
        env:
          DATE: ${{ inputs.date }}
          GH_READ_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_011GAoRcNNa5XKjRjhEkXSja
          ANTHROPIC_ORGANIZATION_ID: 6f6c11d4-6fc0-41a4-bacc-1b3998c64729
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_013TMvkb8iqnvraQvLLhaB99
          ANTHROPIC_WORKSPACE_ID: wrkspc_01HBxqmUuFNiUxTdi5LtpLLU
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-jwt
          CHANGELOG_BLOCKLIST: ${{ secrets.CHANGELOG_BLOCKLIST }}
          CHANGELOG_EMBARGO: ${{ secrets.CHANGELOG_EMBARGO }}

      - if: steps.changelog.outputs.date
        env:
          DATE: ${{ steps.changelog.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A entries README.md feed
          git diff --cached --quiet && exit 0
          git commit -m "Changelog for $DATE"
          git push
